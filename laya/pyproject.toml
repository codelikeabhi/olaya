[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "olaya-laya"
version = "0.1.0"
description = "Olaya's decision layer: the vendored Laya model, its loopback sidecar, training and benchmarks"
requires-python = ">=3.10,<3.13"
license = { text = "Apache-2.0" }
# The model code is vendored in ./laya (see laya/VENDORED.md), so these are Laya's own
# runtime dependencies. ponytail: stdlib http.server for the sidecar, no web framework.
dependencies = [
    "torch>=2.0.0",
    "transformers>=4.48.0",
    "safetensors>=0.4.0",
    "huggingface_hub>=0.20.0",
    "numpy>=1.20.0",
]

[project.optional-dependencies]
# Dataset replay sources for training (Hugging Face datasets).
train = ["datasets>=3.0.0"]

[tool.setuptools]
packages = ["laya", "bench", "train"]
py-modules = ["service"]
